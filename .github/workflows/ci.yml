name: CI

on:
  push:
    branches: [main, stage-1-foundation, foundation-01, design-system-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate workspace
        run: npm run build
      - name: Validate source syntax
        run: npm run lint
      - name: Tests
        run: npm test
