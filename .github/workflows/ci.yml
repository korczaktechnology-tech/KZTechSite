name: Static site CI and GitHub Pages
on:
  push:
    branches: [site]
  pull_request:
    branches: [site]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/css/base.css
          test -f assets/js/main.js
          test -f .nojekyll
          test "$(grep -c '<!doctype html>' index.html)" -eq 1
          ! grep -R -nE 'from ["'"']react|vite|createRoot|ReactDOM' index.html assets pages 2>/dev/null
      - name: Validate backend syntax
        run: node --check apps/api/src/server.mjs
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
