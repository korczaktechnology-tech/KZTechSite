name: CI and GitHub Pages

on:
  push:
    branches: [main, stage-1-foundation, foundation-01, design-system-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate workspace
        run: npm run build
      - name: Validate source syntax
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build GitHub Pages bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          npm run build --workspace=@korczak/web
          cp apps/web/dist/index.html apps/web/dist/404.html
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
