<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contato — Korczak Technologies</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <script>
      window.KZ_API_BASE = "";
    </script>
    <script defer src="../assets/js/main.js"></script>
  </head>
  <body>
    <main class="page container">
      <header class="page-header">
        <div class="eyebrow">CONTATO</div>
        <h1>Vamos conversar.</h1>
        <p class="lead">
          Use o formulário para iniciar uma conversa institucional, técnica ou
          comercial.
        </p>
      </header>
      <form
        data-api="/api/v1/contacts"
        data-success="Mensagem recebida. Nossa equipe poderá retornar pelo e-mail informado."
      >
        <div class="field">
          <label for="name">Nome</label
          ><input
            id="name"
            name="name"
            required
            maxlength="120"
            autocomplete="name"
          />
        </div>
        <div class="field">
          <label for="email">E-mail</label
          ><input
            id="email"
            name="email"
            type="email"
            required
            maxlength="180"
            autocomplete="email"
          />
        </div>
        <div class="field">
          <label for="subject">Assunto</label
          ><input id="subject" name="subject" maxlength="180" />
        </div>
        <div class="field">
          <label for="message">Mensagem</label
          ><textarea
            id="message"
            name="message"
            required
            maxlength="5000"
          ></textarea>
        </div>
        <div class="form-status" aria-live="polite"></div>
        <button class="button" type="submit">Enviar mensagem</button>
      </form>
      <p><a href="../index.html">← Início</a></p>
    </main>
  </body>
</html>
