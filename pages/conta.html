<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta — Korczak Technologies</title><link rel="stylesheet" href="../assets/css/base.css"><script defer src="../assets/js/main.js"></script></head><body><main class="page container"><header class="page-header"><div class="eyebrow">CONTA</div><h1>Acesso à plataforma.</h1><p class="lead">Crie sua conta ou entre para acessar recursos autenticados quando estiverem habilitados para seu ambiente.</p></header><div class="grid grid-3"><article class="card"><h2>Criar conta</h2><form data-api="/api/v1/auth/register" data-success="Conta criada com sucesso."><div class="field"><label for="rn">Nome</label><input id="rn" name="name" required maxlength="120"></div><div class="field"><label for="re">E-mail</label><input id="re" name="email" type="email" required maxlength="180"></div><div class="field"><label for="rp">Senha</label><input id="rp" name="password" type="password" required minlength="8" maxlength="128"></div><div class="form-status" aria-live="polite"></div><button class="button" type="submit">Criar conta</button></form></article><article class="card"><h2>Entrar</h2><form data-api="/api/v1/auth/login" data-success="Login realizado. Token de sessão recebido."><div class="field"><label for="le">E-mail</label><input id="le" name="email" type="email" required maxlength="180"></div><div class="field"><label for="lp">Senha</label><input id="lp" name="password" type="password" required maxlength="128"></div><div class="form-status" aria-live="polite"></div><button class="button" type="submit">Entrar</button></form></article></div><p><a href="../index.html">← Início</a></p></main></body></html>
