<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar proposta — Korczak Technologies</title><link rel="stylesheet" href="../assets/css/base.css"><script defer src="../assets/js/main.js"></script></head><body><main class="page container"><header class="page-header"><div class="eyebrow">COMERCIAL</div><h1>Solicite uma proposta.</h1><p class="lead">Descreva a empresa, o produto ou a necessidade. A solicitação será persistida para análise comercial.</p></header><form data-api="/api/v1/quotes" data-success="Solicitação recebida com sucesso."><div class="field"><label for="name">Nome</label><input id="name" name="name" required maxlength="120"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="180"></div><div class="field"><label for="company">Empresa</label><input id="company" name="company" maxlength="180"></div><div class="field"><label for="product">Produto ou solução</label><input id="product" name="product" required maxlength="180"></div><div class="field"><label for="message">Contexto</label><textarea id="message" name="message" maxlength="5000"></textarea></div><div class="form-status" aria-live="polite"></div><button class="button" type="submit">Enviar solicitação</button></form></main></body></html>
